[package]
name = "source"
version = "0.1.0"
edition = "2024"
description = "Browse and search the deepwa7er fleet's source code from one tailnet page."

[[bin]]
name = "source"
path = "src/main.rs"

[dependencies]
fleet-api = { path = "../crates/fleet-api" }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tower-http = { workspace = true, features = ["fs"] }
anyhow = { workspace = true }
