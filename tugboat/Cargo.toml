[package]
name = "tugboat"
version = "0.1.0"
edition = "2021"
description = "Manifest-driven deployer for personal VPS services"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

# `tugboat serve` only.
axum = "0.8"
async-stream = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
