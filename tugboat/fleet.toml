# fleet.toml — the deepwa7er fleet's git working set.
#
# The ocean-themed suite that lives on the `deepwa7er` VPS + tailnet. This file
# lists the repos tugboat manages together for whole-fleet GIT operations:
#
#   tugboat fleet list      # show members (and which are deployable)
#   tugboat fleet clone     # clone any not yet checked out (new machine setup)
#   tugboat fleet pull      # fast-forward-only pull every clean checkout
#   tugboat fleet status    # git summary per member
#   tugboat fleet deploy    # deploy every discovered deployable (see below)
#
# `path` is relative to `root` (a leading ~/ expands to $HOME); each member also
# records its `repo` remote, for `clone`.
#
# DEPLOYABILITY IS DISCOVERED, NOT DECLARED HERE. A repo under `root` is a
# deployable service iff it contains a `deploy.toml`. That presence alone makes
# it visible to `tugboat serve`, `fleet deploy`, and lighthouse — no entry in
# this file is needed to deploy or monitor a new service. Listing a repo here is
# only about the cross-machine git working set (clone/pull/status): most
# deployable services appear here too so they're cloned on every box, but a
# brand-new service is deployable the moment it has a deploy.toml.
#
# This is the operational view of the suite; the richer graph (edges, non-fleet
# projects) lives in secondbrain/topology.yaml, which harbor renders.

root = "~/code"

# ── deployable services (have a deploy.toml; also cloned on every box) ───────

[[members]]
# Observability layer — deploy first so new/updated services are monitored.
path = "lighthouse"
repo = "git@github.com:deepwa7er/lighthouse.git"

[[members]]
# Tailnet reverse-proxy front door, host-routes to the internal services.
path = "breakwater"
repo = "git@github.com:deepwa7er/breakwater.git"

[[members]]
# Address-bar redirect front door (`b mail` → mail, etc.).
path = "ferry"
repo = "git@github.com:deepwa7er/ferry.git"

[[members]]
path = "tidepool"
repo = "git@github.com:deepwa7er/tidepool.git"

[[members]]
path = "harbor"
repo = "git@github.com:deepwa7er/harbor.git"

[[members]]
path = "lagoon"
repo = "git@github.com:deepwa7er/lagoon.git"

[[members]]
path = "driftword"
repo = "git@github.com:deepwa7er/driftword.git"

[[members]]
# Ticket queue for autonomous fleet work — the worker's own home.
path = "drydock"
repo = "git@github.com:deepwa7er/drydock.git"

[[members]]
# Fleet-wide settings — the shared dark/light theme every service honors.
path = "tide"
repo = "git@github.com:deepwa7er/tide.git"

# ── clone-only repos (no deploy.toml: deployed another way, or not a service) ─

[[members]]
# The fleet documentation site's React frontend. Not a tugboat-deploy member:
# it has no service/unit of its own and ships as static files via
# `tugboat fleet docs` (see [docs] below), served by breakwater. clone/pull only.
path = "pilot"
repo = "git@github.com:deepwa7er/pilot.git"
[[members]]
# Heaviest VPS tenant: a multi-unit backend (sonar-discovery + navidrome +
# slskd), deployed outside tugboat. NOTE: this repo lives at ~/code/apple/sonar
# on the laptop but ~/code/sonar on fedora — standardize the location before
# relying on `fleet clone`/`status` for it (see the README caveat).
path = "sonar"
repo = "git@github.com:deepwa7er/sonar.git"
[[members]]
# Offsite restic backup of the fleet's /var/lib state → Cloudflare R2. Shell +
# systemd units, set up via its own provision.sh (not a tugboat-built binary),
# so clone/pull only.
path = "fleet-backup"
repo = "git@github.com:deepwa7er/fleet-backup.git"
[[members]]
# Reusable systemd watcher that commits+pushes a service's live config to git on
# change (first user: ferry's /var/lib/ferry ⇄ ferry-config). Provisioned infra,
# clone/pull only. (ferry-config itself isn't a fleet member — it's VPS state,
# restored by cloning to /var/lib/ferry, not checked out on dev boxes.)
path = "git-autocommit"
repo = "git@github.com:deepwa7er/git-autocommit.git"

[[members]]
# Source-code viewer for the whole fleet. Runs on the dev box (not the VPS) as a
# launchd agent — it reads every member's working tree to browse/search source —
# and is fronted by breakwater at source.internal.deepwa7er.com. No deploy.toml
# (not a VPS-deployed service), so clone/pull only.
path = "source"
repo = "git@github.com:deepwa7er/source.git"
# ── the fleet documentation site ─────────────────────────────────────────────
# `tugboat fleet docs` builds the `pilot` frontend, overlays the harvested model
# (fleet.json) and each repo's rustdoc, and ships the assembled static site to
# `dest` on `host`, where breakwater serves it (a serve_dir route) at `url`.
[docs]
repo = "pilot"
build = "cd web && bun install && bun run build"
dist = "web/dist"
host = "deepwa7er"
dest = "/opt/pilot/web"
url = "https://docs.internal.deepwa7er.com"
# Extra repos counted in the line-of-code total beyond the deployable members:
# tugboat itself (the fleet's deployer) is fleet code we wrote, but not a service.
extra_loc = ["tugboat"]

# Claude guidance documents for pilot's Guidance section. Each member's CLAUDE.md
# is auto-included; these add the global doctrine, the worker prompt, the skills,
# and the cross-session memory notes. A `path` is a file or a directory of `.md`
# (a dir also picks up each `*/SKILL.md`); `~/…` and absolute paths are allowed.
[[docs.guidance]]
category = "Doctrine"
label = "Global CLAUDE.md"
path = "~/.claude/CLAUDE.md"

[[docs.guidance]]
category = "Worker prompt"
label = "Drydock worker-task"
path = "drydock/docs/worker-task.md"

[[docs.guidance]]
category = "Skills"
path = "~/.claude/skills"

[[docs.guidance]]
category = "Memory"
path = "~/.claude/projects/-Users-deepwater-code/memory"
