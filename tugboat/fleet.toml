# fleet.toml — the deepwa7er fleet.
#
# The ocean-themed suite that lives on the `deepwa7er` VPS + tailnet. tugboat
# reads this to operate on the whole set at once:
#
#   tugboat fleet list      # show members
#   tugboat fleet clone     # clone any not yet checked out (new machine setup)
#   tugboat fleet pull      # fast-forward-only pull every clean checkout
#   tugboat fleet status    # git summary per member
#   tugboat fleet deploy    # deploy each `deploy = true` member, in listed order
#
# `path` is relative to `root` (a leading ~/ expands to $HOME). Each deployable
# member's build/ship/health config stays in its own repo's deploy.toml — this
# file only records where the repo is and how to clone it. Members are listed in
# deploy order; each deploy is independent and atomic (own rollback).
#
# This is the operational view of the suite; the richer graph (edges, non-fleet
# projects) lives in secondbrain/topology.yaml, which harbor renders.

root = "~/code"

# ── deployed via tugboat (have a deploy.toml) ───────────────────────────────

[[members]]
# Observability layer — deploy first so new/updated services are monitored.
path = "lighthouse"
repo = "git@github.com:deepwa7er/lighthouse.git"

[[members]]
# Tailnet reverse-proxy front door, host-routes to the internal services.
path = "breakwater"
repo = "git@github.com:deepwa7er/breakwater.git"

[[members]]
# Address-bar redirect front door (`b mail` → mail, etc.).
path = "ferry"
repo = "git@github.com:deepwa7er/ferry.git"

[[members]]
path = "tidepool"
repo = "git@github.com:deepwa7er/tidepool.git"

[[members]]
path = "harbor"
repo = "git@github.com:deepwa7er/harbor.git"

[[members]]
path = "lagoon"
repo = "git@github.com:deepwa7er/lagoon.git"

[[members]]
path = "driftword"
repo = "git@github.com:deepwa7er/driftword.git"

# ── part of the fleet, deployed some other way (clone/pull/status only) ──────

[[members]]
# The fleet documentation site's React frontend. Not a tugboat-deploy member:
# it has no service/unit of its own and ships as static files via
# `tugboat fleet docs` (see [docs] below), served by breakwater. clone/pull only.
path = "pilot"
repo = "git@github.com:deepwa7er/pilot.git"
deploy = false

[[members]]
# Heaviest VPS tenant: a multi-unit backend (sonar-discovery + navidrome +
# slskd), deployed outside tugboat. NOTE: this repo lives at ~/code/apple/sonar
# on the laptop but ~/code/sonar on fedora — standardize the location before
# relying on `fleet clone`/`status` for it (see the README caveat).
path = "sonar"
repo = "git@github.com:deepwa7er/sonar.git"
deploy = false

[[members]]
# Offsite restic backup of the fleet's /var/lib state → Cloudflare R2. Shell +
# systemd units, set up via its own provision.sh (not a tugboat-built binary),
# so clone/pull only.
path = "fleet-backup"
repo = "git@github.com:deepwa7er/fleet-backup.git"
deploy = false

[[members]]
# Reusable systemd watcher that commits+pushes a service's live config to git on
# change (first user: ferry's /var/lib/ferry ⇄ ferry-config). Provisioned infra,
# clone/pull only. (ferry-config itself isn't a fleet member — it's VPS state,
# restored by cloning to /var/lib/ferry, not checked out on dev boxes.)
path = "git-autocommit"
repo = "git@github.com:deepwa7er/git-autocommit.git"
deploy = false

# ── the fleet documentation site ─────────────────────────────────────────────
# `tugboat fleet docs` builds the `pilot` frontend, overlays the harvested model
# (fleet.json) and each repo's rustdoc, and ships the assembled static site to
# `dest` on `host`, where breakwater serves it (a serve_dir route) at `url`.
[docs]
repo = "pilot"
build = "cd web && bun install && bun run build"
dist = "web/dist"
host = "deepwa7er"
dest = "/opt/pilot/web"
url = "https://docs.internal.deepwa7er.com"
# Extra repos counted in the line-of-code total beyond the deployable members:
# tugboat itself (the fleet's deployer) is fleet code we wrote, but not a service.
extra_loc = ["tugboat"]
