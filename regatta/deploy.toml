# tugboat deploy manifest — github.com/deepwa7er/fleet
#   deploy:  tugboat deploy      (from this directory)
#
# Routine deploy: build the web bundle (bun) and a static musl binary locally,
# then ship the binary and the built web assets. Infra provisioning (service
# user, systemd unit, state dir) is deploy/provision.sh — a one-time/on-change
# step, not run here. regatta binds loopback; breakwater fronts it at
# https://regatta.intern.deepwa7er.net (route is generated).
name = "regatta"
host = "deepwa7er"
# Loopback port the service binds; breakwater's route is GENERATED from this
# (`tugboat fleet gen`).
port = 8096
description = "Sequence-voting party game — propose a ten-step gauntlet of activities and let the crew vote the winning course."

[state]
# The proposals-and-votes DB — snapshotted by fleet-backup (list is generated).
db = "regatta.db"

[build]
# Frontend (bun) then a static musl cross-compile. regatta bundles SQLite's C
# source via rusqlite, so the cross C-compiler/archiver are wired up alongside
# the linker.
cmd = "(cd web && bun install && bun run build) && (rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1 || true) && CC_x86_64_unknown_linux_musl=x86_64-linux-musl-gcc AR_x86_64_unknown_linux_musl=x86_64-linux-musl-ar CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc cargo build --release --target x86_64-unknown-linux-musl"

[[artifacts]]
src = "{workspace}/target/x86_64-unknown-linux-musl/release/regatta"
dest = "/usr/local/bin/regatta"

[[artifacts]]
kind = "dir"
src = "web/dist"
dest = "/opt/regatta/web"

# regatta binds loopback, so health is a real HTTP check on it (the shared
# /healthz from fleet-common).
[health]
url = "http://127.0.0.1:8096/healthz"

[lighthouse]
# Monitor regatta from the fleet dashboard (status + logs).
enroll = true
