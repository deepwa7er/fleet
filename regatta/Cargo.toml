[package]
name = "regatta"
version = "0.1.0"
edition = "2021"
description = "Sequence-voting party game — propose a ten-step gauntlet of activities (donuts, handstands, Rocket League…) and let the crew vote the winning course. Single binary serving a web view and JSON API over one SQLite store."

[dependencies]
fleet-common = { path = "../crates/fleet-common" }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
