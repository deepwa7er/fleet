# Nginx vhost for live.deepwa7er.com — public front door for shutter-relay.
#
# Proxies everything (including WebSocket upgrade) to the relay on 127.0.0.1:8125.
# TLS via certbot (certonly --nginx), same pattern as blog/board vhosts on this host.
#
# Install:
#   # 1. HTTP-only for certbot
#   cat > /etc/nginx/sites-available/live.deepwa7er.com <<'EOF'
#   server { listen 147.182.250.13:80; server_name live.deepwa7er.com; location / { return 200 "provisioning\n"; } }
#   EOF
#   ln -sf /etc/nginx/sites-available/live.deepwa7er.com /etc/nginx/sites-enabled/live.deepwa7er.com
#   nginx -t && systemctl reload nginx
#   certbot certonly --nginx -d live.deepwa7er.com --non-interactive --agree-tos -m hello@joemafrici.com
#   # 2. replace with this file
#   scp shutter-relay/deploy/nginx-live.conf vps:/etc/nginx/sites-available/live.deepwa7er.com
#   nginx -t && systemctl reload nginx

server {
    server_name live.deepwa7er.com;

    location / {
        proxy_pass http://127.0.0.1:8125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 147.182.250.13:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/live.deepwa7er.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.deepwa7er.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = live.deepwa7er.com) {
        return 301 https://$host$request_uri;
    }
    listen 147.182.250.13:80;
    server_name live.deepwa7er.com;
    return 404;
}
