# Local development config. Binds to localhost and serves the freshly built
# frontend from web/dist. systemctl/journalctl only exist on the Linux VPS, so
# discovery returns empty locally; the pinned units below give the allowlist
# something to resolve for route testing.
bind = "127.0.0.1"
port = 8080
static_dir = "web/dist"
target = "lighthouse.target"

[[services]]
unit = "notes.service"
name = "Notes"
