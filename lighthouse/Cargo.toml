[package]
name = "lighthouse"
version = "0.1.0"
edition = "2024"
description = "systemd service status + log dashboard and deploy button for the deepwa7er fleet."

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
# Plain HTTP only (the tugboat daemon is reached over the tailnet, no TLS), so
# the default TLS backends are disabled to keep the dependency tree light.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
tokio-stream = "0.1"
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
