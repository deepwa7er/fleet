[package]
name = "lighthouse"
version = "0.1.0"
edition = "2024"
description = "systemd service status + log dashboard and deploy button for the deepwa7er fleet."

[dependencies]
tugboat-ledger = { path = "../crates/tugboat-ledger" }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
# Plain HTTP only (the tugboat daemon is reached over the tailnet, no TLS), so
# the default TLS backends are disabled to keep the dependency tree light.
reqwest = { workspace = true, features = ["json", "stream"] }
# Bundled SQLite (compiled in, so the static musl cross-build needs no system
# libsqlite) for the health-history time-series. Matches the fleet's version.
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util"] }
tokio-stream = "0.1"
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors"] }
