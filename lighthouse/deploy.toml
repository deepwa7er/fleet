# tugboat deploy manifest — github.com/deepwa7er/tugboat
#   deploy:  tugboat deploy      (from this directory)
#
# Routine deploy: build the frontend + backend locally, ship the binary and the
# built web assets. Infra provisioning (systemd unit + target, config, service
# user, and the polkit control grant regenerated from lighthouse.target
# membership) is deploy/provision.sh — re-run it when you enroll a new service.
name = "lighthouse"
host = "deepwa7er"
# Loopback port the service binds; breakwater\'s route is GENERATED from this
# (`tugboat fleet gen`).
port = 8080

[build]
requirements = ["x86_64-linux-musl"]
# Frontend (bun) then a static musl cross-compile of the backend. No Node/Rust
# toolchain needed on the VPS.
cmd = "(cd web && bun install && bun run build) && cargo build --release --target x86_64-unknown-linux-musl"

[[artifacts]]
src = "{workspace}/target/x86_64-unknown-linux-musl/release/lighthouse"
dest = "/usr/local/bin/lighthouse"

[[artifacts]]
kind = "dir"
src = "web/dist"
dest = "/opt/lighthouse/web"

# lighthouse binds the tailnet IP (no loopback), so health is the unit's active
# state. (default health = `systemctl is-active lighthouse`)

[lighthouse]
# Monitor lighthouse on its own dashboard — enroll it in lighthouse.target like
# any other service, so the dashboard shows its own status/logs/deploy alongside
# the fleet. (tugboat re-asserts this add-wants on every deploy; a from-scratch
# reprovision relies on this flag to re-enroll.)
enroll = true
