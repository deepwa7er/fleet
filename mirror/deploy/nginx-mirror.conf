# The PUBLIC front door for the board mirror: https://board.deepwa7er.com
#
# Installed by deploy/provision.sh, which follows the install order below. It
# matters: nginx refuses to load a `listen … ssl` block whose certificate is
# missing, so enabling this file before the cert exists fails `nginx -t`
# outright.
#
#   1. a temporary HTTP-only block so ACME can reach the challenge
#   2. certbot certonly --nginx -d board.deepwa7er.com
#   3. this file installed over the temporary one, then nginx -t && reload
#
# `certonly` rather than `certbot --nginx` on purpose: the latter rewrites the
# vhost in place, stripping every comment in it.
#
# `board.deepwa7er.com` already resolves here through the existing wildcard
# `*.deepwa7er.com` A record, so HTTP-01 works with no DNS change.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS VHOST DOES NOT NEED TO DO
#
# The blog vhost next door carries a warning that its whole security boundary
# rests on pinning `proxy_set_header Host` to a literal, because that app
# serves an admin surface to one hostname and a public surface to another.
#
# mirror has no such split. It has no admin surface, no session, no form and no
# write path of any kind — the upstream is a process that can only read a local
# snapshot. There is nothing behind it for a forged Host header to reach. The
# literal below is therefore documentation rather than a boundary, and if a
# future change makes the app read the Host header, THAT is the change to
# examine, not this line.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name board.deepwa7er.com;

    # No `allow`/`deny` — this site exists to be read by anyone. That is the
    # entire point of it.

    location / {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;

        # Inert by design; see the note above.
        proxy_set_header Host board.deepwa7er.com;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No Upgrade/Connection headers: there are no websockets here, and no
        # JavaScript to open one.
    }

    # mirror sets its own Content-Security-Policy, X-Content-Type-Options and
    # Referrer-Policy per response (see src/server.rs), and they differ between
    # a page and an image — so they are NOT duplicated here.
    #
    # HSTS is the exception: the app cannot know it is being served over TLS,
    # and nothing else on this hostname would ever set it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The pages are text and compress to roughly a quarter of their size. The
    # stylesheet is inlined in each one, which makes this worth more than it
    # usually is.
    gzip on;
    # text/html is NOT listed: nginx always compresses it when gzip is on and
    # naming it again is a "duplicate MIME type" warning at config test time.
    gzip_types text/plain;
    gzip_min_length 512;

    # No proxy_cache and no rate limit. A page here is a handful of indexed
    # SQLite reads and a string build; adding a cache would be tuning ahead of
    # a measurement. If this ever gets hugged to death, the app already sends
    # `Cache-Control: public, max-age=60`, so a proxy_cache_path plus two
    # directives is the whole fix.

    listen 147.182.250.13:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/board.deepwa7er.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.deepwa7er.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP redirects to HTTPS. Pinned to the public IPv4 like every other
# vhost on this host: a bare `listen 80` would land in a different listen group
# from the pinned ones and change which server block is the default.
#
# IPv4 only — there is no AAAA record for this name, or for the zone.
server {
    if ($host = board.deepwa7er.com) {
        return 301 https://$host$request_uri;
    }

    listen 147.182.250.13:80;
    server_name board.deepwa7er.com;
    return 404;
}
