# The fleet's gate: anything on main must be deployable. tugboat ships
# origin/main, so these jobs are the invariant behind every deploy —
# workspace tests + clippy (denied warnings), every web app's build
# (which includes its tsc typecheck), and tidepool's Go module.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build every web app (includes typecheck)
        run: |
          for app in drydock clothes lighthouse source; do
            echo "==> $app"
            (cd "$app/web" && bun install --frozen-lockfile && bun run build)
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tidepool/go.mod
      - name: Vet, test, build tidepool
        working-directory: tidepool
        run: |
          go vet ./...
          go test ./...
          go build ./...
