# tugboat deploy manifest — deepwa7er fleet
#   deploy:  tugboat deploy      (from this directory)
#
# Routine deploy: build the web bundle (bun) and a static musl binary locally,
# then ship the binary and the built web assets. Infra provisioning (service
# user, systemd unit, state dir) is deploy/provision.sh — a one-time/on-change
# step, not run here. recipes binds loopback; breakwater fronts it at
# https://recipes.intern.deepwa7er.net (route generated by `tugboat fleet gen`).
name = "recipes"
host = "deepwa7er"
# Loopback port the service binds; breakwater's route is GENERATED from this
# (`tugboat fleet gen`).
port = 8097

# NO [state] BLOCK: recipes' data lives in keep on OVH now (migrated under
# fleet #145), snapshotted to R2 every minute by keep itself. The local file
# /var/lib/recipes/recipes.db is a frozen pre-migration relic — fleet-backup
# must let go of it, or it would ship a stale copy forever while looking
# like coverage.

[build]
requirements = ["x86_64-linux-musl"]
# Frontend (bun) then a static musl cross-compile. recipes bundles SQLite's C
# source via rusqlite; tugboat resolves the host's musl C
# toolchain and exports it to this build.
cmd = "(cd web && bun install && bun run build) && (rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1 || true) && cargo build --release --target x86_64-unknown-linux-musl"

[[artifacts]]
src = "{workspace}/target/x86_64-unknown-linux-musl/release/recipes"
dest = "/usr/local/bin/recipes"

[[artifacts]]
kind = "dir"
src = "web/dist"
dest = "/opt/recipes/web"

# recipes binds loopback, so health is a real HTTP check on it (the shared
# /healthz from fleet-common).
[health]
url = "http://127.0.0.1:8097/healthz"

[lighthouse]
# Monitor recipes from the fleet dashboard (status + logs).
enroll = true
