# breakwater — tailnet reverse proxy.
#
# Routes HTTPS by hostname to local services. The listeners bind the Tailscale
# IP, so breakwater is reachable only from the tailnet — the tailnet is the
# security boundary, the same model as the rest of the deepwa7er fleet.
#
# This file IS the live config: tugboat ships it verbatim to
# /etc/breakwater/breakwater.toml on every deploy (see deploy.toml). To change
# routing, edit a [[routes]] block here and `tugboat deploy` — the deploy
# restarts breakwater, which picks up the new routes. No host edits, no sed.
#
# The listeners carry no IP: breakwater resolves the host's Tailscale IPv4 at
# startup and binds these ports on it, so the file is host-independent.

# TLS listener — the front door. Every service is reached as
# https://<name>.intern.deepwa7er.net on the tailnet IP.
https_port = 443

# Plain-HTTP listener; 308-redirects everything to its https:// equivalent.
http_redirect_port = 80

# Loopback-only health endpoint for tugboat's deploy health check.
health_addr = "127.0.0.1:8079"

# The subdomain space the whole fleet lives under. Each route below gives only
# its `label`; the hostname is `<label>.<base_domain>`, and the ACME cert is a
# wildcard over this domain. This line and `cloudflare_zone` (below) are the only
# two settings that carry the fleet's domain — change them to move the fleet.
base_domain = "intern.deepwa7er.net"

# Automatic certificates via ACME DNS-01 (Cloudflare). breakwater obtains and
# renews a wildcard cert in-process and hot-swaps it with no downtime.
#
# Alternatively, omit [acme] and use a static cert from disk (e.g. for local
# testing):
#   [tls]
#   cert = "/etc/breakwater/certs/fullchain.pem"
#   key  = "/etc/breakwater/certs/privkey.pem"
# Exactly one of [acme] or [tls] must be set.
[acme]
# Cert subject names default to a wildcard over `base_domain` (`*.<base_domain>`),
# which covers every routed host. Set `domains = [...]` here only to override.
contact = "mailto:hello@joemafrici.com"
# Cloudflare DNS zone hosting the challenge records.
cloudflare_zone = "deepwa7er.net"
# Token file (DNS:Edit + Zone:Read), installed on the host at mode 600.
cloudflare_token_file = "/etc/breakwater/cloudflare-token"
# Account key + issued cert/key are cached here so restarts don't re-issue.
# This is writable service state (systemd manages it via StateDirectory).
cache_dir = "/var/lib/breakwater/acme"
# Use the Let's Encrypt staging directory while testing to avoid rate limits:
#   directory = "https://acme-staging-v02.api.letsencrypt.org/directory"

# `upstream` is wherever the service actually listens — every fleet service binds
# loopback (127.0.0.1:<port>), so breakwater is their only tailnet-facing entry
# point. (tidepool is the exception: not routed here at all — it's its own
# Tailscale node and serves HTTPS itself.)
# ── BEGIN GENERATED ROUTES (tugboat fleet gen) ──
# One route per fleet service declaring `port` in its deploy.toml — derived
# by `tugboat fleet gen`; CI verifies with --check. Don't edit inside the
# markers: change the service's deploy.toml and re-run the generator.
# Hand-written routes (sonar's units, docs, source, external members)
# live outside this block.

[[routes]]
label = "clothes"
upstream = "127.0.0.1:8099"

[[routes]]
label = "depot"
upstream = "127.0.0.1:8100"

[[routes]]
label = "driftword"
upstream = "127.0.0.1:8091"

[[routes]]
label = "drydock"
upstream = "127.0.0.1:8093"

[[routes]]
label = "ferry"
upstream = "127.0.0.1:7777"

[[routes]]
label = "harbor"
upstream = "127.0.0.1:8090"

[[routes]]
label = "lighthouse"
upstream = "127.0.0.1:8080"

[[routes]]
label = "mirror"
upstream = "127.0.0.1:8103"

[[routes]]
label = "readout"
upstream = "127.0.0.1:8101"

[[routes]]
label = "recipes"
upstream = "127.0.0.1:8097"

[[routes]]
label = "regatta"
upstream = "127.0.0.1:8096"

[[routes]]
label = "spyglass"
upstream = "127.0.0.1:8095"

[[routes]]
label = "tide"
upstream = "127.0.0.1:8094"

# ── END GENERATED ROUTES ──

# lagoon — capture-first notes. An EXTERNAL member (its repo isn't in the fleet
# monorepo, so `fleet gen` can't read its deploy.toml in CI); its route is the
# one fleet service maintained by hand here.
[[routes]]
label = "lagoon"
upstream = "127.0.0.1:8092"

# notes — the fleet's Rails note-taking app. A NESTED repo at ~/code/fleet/notes
# (its own git history, not committed to the fleet monorepo), so like lagoon its
# deploy.toml isn't visible to CI's `fleet gen --check` and the route is
# hand-written here. Deployed as a Docker container (readout/blog/public_site
# pattern) publishing loopback.
[[routes]]
label = "notes"
upstream = "127.0.0.1:8105"

# blog — the ADMIN half of the public blog at https://blog.deepwa7er.com.
# External member (repo at ~/code/blog), so hand-written like lagoon's.
#
# READ THIS BEFORE CHANGING IT. This is the first route here that points at an
# app the public internet can also reach, and the arrangement is deliberate:
#
#   internet ──▶ nginx :443 (own certbot cert)  ──┐
#                                                 ├─▶ 127.0.0.1:8102
#   tailnet  ──▶ breakwater (this route)       ──┘
#
# One Rails process, two front doors, separated by the Host header. The app
# draws its /admin routes inside a constraint on `blog.intern.deepwa7er.net`,
# so they do not exist for a request carrying any other host. breakwater
# forwards the inbound Host verbatim, which is exactly what makes the admin
# reachable here; the public nginx vhost pins Host to a literal, which is what
# keeps it unreachable there.
#
# breakwater's own posture is UNCHANGED by this. It still binds only the
# Tailscale IP and still serves only *.intern.deepwa7er.net — the public name is
# nginx's business, not this file's. Giving breakwater a public listener is the
# thing that would have been unsafe, because it fronts `harness`, which is
# unauthenticated RCE; nothing here does that. Do not "simplify" this by moving
# blog.deepwa7er.com onto breakwater.
[[routes]]
label = "blog"
upstream = "127.0.0.1:8102"

# The fleet documentation site (pilot) — process-less static files, so breakwater
# serves the directory directly instead of proxying an upstream. `tugboat fleet
# docs` assembles and ships the site to this path; a path that doesn't resolve to
# a file falls back to the SPA's index.html.
[[routes]]
label = "docs"
serve_dir = "/opt/pilot/web"

# netfps client distribution — external member (repo deepwa7er/netfps).
# Download page + version manifest + per-platform game binaries; process-less
# static files like docs, so breakwater serves the directory directly. The
# netfps repo's deploy/release.sh builds and ships releases into this path;
# the game client checks manifest.json here at every launch to self-update.
[[routes]]
label = "netfps"
serve_dir = "/srv/netfps-dist"

# Source-code viewer (source) — a dev-box upstream. The fleet's working trees
# live on the dev box — since 2026-08-12 the Fedora desktop (fedora), before
# that the Mac (deepwater-1) — so `source` runs there (a systemd user unit) and
# breakwater proxies to it over the tailnet. The page is reachable only while
# the dev box is up, which is inherent: that's where the source is.
#
# Addressed by its MagicDNS name, not a raw 100.x address: a node's tailnet
# IP is not a constant. It changed when a duplicate Tailscale node was retired
# (2026-07-26) and the hardcoded address here silently pointed at a dead node.
# The name follows the node.
[[routes]]
label = "source"
upstream = "fedora.tailcfab97.ts.net:7879"

# Code map / call tracer (atlas) — dev-box upstream like source, and for the
# same reason: it runs rust-analyzer over the working trees, which live there.
[[routes]]
label = "atlas"
upstream = "fedora.tailcfab97.ts.net:7880"

# Coding-agent harness (harness) — dev-box upstream like source and atlas: the
# agent loop runs commands against the working trees, which live there.
#
# NOTE, deliberately different from every other route here: the services above
# are CRUD over their own data, so "tailnet only, no auth" bounds what a caller
# can do. harness executes arbitrary commands as the logged-in user, so this
# route publishes an unauthenticated remote-code-execution surface to every
# device on the tailnet. That is a decision, not an oversight — revisit it if
# the tailnet ever gains a device you trust less than the dev box.
[[routes]]
label = "harness"
upstream = "fedora.tailcfab97.ts.net:8098"

# Fizzy (37signals' kanban) — the first upstream that is neither a fleet service
# nor on the VPS nor on the dev box: a Docker app on the `fedora-1` laptop,
# managed by the `once` CLI (see also the Once Campfire install on the same box).
#
# The upstream is that laptop's :80, which belongs to Once's shared `kamal-proxy`
# container, NOT to Fizzy directly — several Once apps sit behind it and it
# selects among them strictly by `Host`. This route works because breakwater
# forwards the inbound Host verbatim, so kamal-proxy sees the full
# `fizzy.<base_domain>` and picks the right app. Install Fizzy with a matching
# `once deploy --host`, or kamal-proxy 404s.
#
# Fizzy is deployed `--disable-tls`: its hostname resolves to a 100.x tailnet
# address, which ACME HTTP-01 cannot reach, so kamal-proxy can never obtain a
# cert for it. breakwater terminates TLS here instead, under the wildcard.
#
# Addressed by MagicDNS name rather than a raw 100.x address, for the same reason
# as `source` above: a node's tailnet IP is not a constant.
[[routes]]
label = "fizzy"
upstream = "fedora-1.tailcfab97.ts.net:80"

# Mailpit — the fleet's internal mail sink, on the fedora-1 laptop next to the
# Once apps that generate mail. A plain Docker container (not an `once` app),
# attached to the `once` bridge network so Fizzy and Campfire reach its SMTP
# server by container name (`mailpit:1025`) with no published port and no
# hardcoded IP.
#
# WHY A SINK RATHER THAN A MAIL SERVER: outbound :25 is blocked from both this
# VPS (DigitalOcean policy) and the laptop's residential ISP, so no self-hosted
# server here could ever deliver to the public internet. Mailpit accepts mail for
# any recipient and delivers it nowhere — you read it in this web UI instead.
# Nothing sent to it leaves the tailnet.
#
# The upstream is the UI port only. Mailpit's SMTP port is deliberately NOT
# published to the host: it is reachable solely from inside the `once` docker
# network, which is why running it with `--smtp-auth-accept-any` (needed because
# Rails sends AUTH whenever SMTP_USERNAME is set, and `once` writes that variable
# as an empty string it gives no way to unset) exposes nothing.
#
# On the laptop the UI is bound to the Tailscale IP rather than 0.0.0.0: it
# renders sign-in codes in plaintext, so LAN exposure would let anyone on the
# wifi read a code and sign in as the user.
[[routes]]
label = "mail"
upstream = "fedora-1.tailcfab97.ts.net:8025"

# agent — skiff, the phone web UI over a headless opencode server. The FIRST
# service on the fedora DESKTOP behind breakwater: like `source` (the dev box)
# and `fizzy`/`mail` (the laptop), the upstream is the host's MagicDNS name
# over the tailnet, never a raw 100.x IP (a node's tailnet IP is not a
# constant). skiff binds the desktop's tailnet IP on 8120 — breakwater cannot
# reach a loopback listener on a remote host, so the app stays reachable on
# that port directly; the tailnet is the boundary either way.
#
# The app is deliberately UNAUTHENTICATED: driving opencode is effectively RCE
# on that box, and this is the same posture breakwater flags for `harness` —
# reachable from every device on the tailnet. The desktop is often powered
# off; while it is, this route 502s.
[[routes]]
label = "agent"
upstream = "fedora.tailcfab97.ts.net:8120"

# Note: tidepool is intentionally NOT routed here. It runs as its own Tailscale
# node (tsnet, `-tls`) and serves HTTPS itself at https://tidepool — there is no
# plain-HTTP backend to proxy to.
