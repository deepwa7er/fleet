# ide is deliberately its own Cargo workspace, excluded from the fleet
# workspace (see the root Cargo.toml). The gpui stack is one of the largest
# dependency trees in the Rust ecosystem and needs GUI system libraries to
# build; folding it into the fleet workspace would put that cost inside every
# `cargo test --workspace` / clippy gate run for unrelated fleet changes.
# ide's own gates run from this directory instead (see README.md), the same
# per-project pattern as the Rails apps, tidepool, and `bun run build`.
[package]
name = "ide"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
# gpui and gpui_platform are declared exactly as gpui-component declares them
# (version + git, no rev) so cargo unifies both onto a single gpui source;
# pinning a rev here would create a second, conflicting copy. Reproducibility
# comes from Cargo.lock, which pins the actual commits and is committed.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# Grammar features cover the fleet's languages (Rails: ruby/erb; Rust; Go;
# React: js/ts/tsx/html/css; Python; plus config and docs formats) rather than
# pulling all ~35 built-in grammars.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c" }

# Debug builds of the GPU/UI stack are unusably slow at opt-level 0; upstream
# gpui-component applies the same overrides.
[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
