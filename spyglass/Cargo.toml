[package]
name = "spyglass"
version = "0.1.0"
edition = "2024"
description = "Federated search across the deepwa7er fleet — one box over code (source) and notes (lagoon)."

[dependencies]
fleet-api = { path = "../crates/fleet-api" }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
# Plain HTTP only: the upstream search services are reached over the tailnet /
# loopback (no TLS), so the default TLS backends are disabled to keep the build
# a clean static musl with no C crypto deps.
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
toml = { workspace = true }
