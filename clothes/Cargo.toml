[package]
name = "clothes"
version = "0.1.0"
edition = "2021"
description = "Wardrobe organizer — a single binary serving a web view and JSON API over one SQLite store, for cataloguing clothes by category while building a classic wardrobe."

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Best-effort link-metadata fetch (og: tags) so pasting a product URL can
# pre-fill title/store/image/price. Blocking HTTP + HTML parse, run off the
# async runtime via spawn_blocking.
ureq = { workspace = true }
scraper = "0.20"
