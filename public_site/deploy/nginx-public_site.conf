# The PUBLIC front door for the homepage: https://deepwa7er.com
#
# INSTALL ORDER MATTERS — the certificate must exist before this file is
# enabled. nginx refuses to load a `listen ... ssl` block whose
# `ssl_certificate` is missing, so enabling this first fails `nginx -t` outright
# (verified the hard way on blog.deepwa7er.com). `deepwa7er.com` already
# resolves to this box, so HTTP-01 works with no DNS change.
#
#   # 1. temporary HTTP-only block so ACME can reach the challenge
#   ssh vps 'cat > /etc/nginx/sites-available/deepwa7er.com <<EOF
#   server {
#       listen 147.182.250.13:80;
#       server_name deepwa7er.com www.deepwa7er.com;
#       location / { return 200 "provisioning\n"; }
#   }
#   EOF
#   ln -sf /etc/nginx/sites-available/deepwa7er.com \
#          /etc/nginx/sites-enabled/deepwa7er.com
#   nginx -t && systemctl reload nginx'
#
#   # 2. issue the certificate (certonly, so this file is not rewritten)
#   ssh vps 'certbot certonly --nginx -d deepwa7er.com -d www.deepwa7er.com \
#              --non-interactive --agree-tos -m hello@joemafrici.com'
#
#   # 3. install this file over the temporary one
#   scp deploy/nginx-public_site.conf vps:/etc/nginx/sites-available/deepwa7er.com
#   ssh vps 'nginx -t && systemctl reload nginx'
#
# `certonly` rather than `certbot --nginx` on purpose: the latter rewrites the
# vhost in place, which would strip every comment in this file.
#
# Unlike blog, this site has NO host-separated admin — it is public-only — so
# `proxy_set_header Host` does not need to be a literal. `$host` is correct
# here and handles both deepwa7er.com and www.deepwa7er.com in one block.

server {
    server_name deepwa7er.com www.deepwa7er.com;

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers are deliberately NOT set here. Rails sends its own on
    # every response — HSTS from `config.force_ssl`, plus nosniff, SAMEORIGIN,
    # Referrer-Policy and X-Permitted-Cross-Domain-Policies from
    # ActionDispatch::Response.default_headers. Adding them here would duplicate
    # them, and duplicated HSTS headers are ignored by some clients.

    listen 147.182.250.13:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/deepwa7er.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepwa7er.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP redirects to HTTPS. Pinned to the public IPv4 like every other
# vhost on this host: a bare `listen 80` would land in a different listen group
# from the pinned ones and change which server block is the default.
#
# IPv4 only — there is no AAAA record for this name, or for the zone.
server {
    if ($host = deepwa7er.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.deepwa7er.com) {
        return 301 https://$host$request_uri;
    }

    listen 147.182.250.13:80;
    server_name deepwa7er.com www.deepwa7er.com;
    return 404;
}
