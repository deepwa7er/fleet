# tugboat deploy manifest — deepwa7er fleet
#   deploy:  tugboat deploy      (from this directory)
#
# public_site is the general homepage at https://deepwa7er.com — the warm-paper
# document for the domain root. It shares the public-edge pattern with `blog`:
# it does NOT declare a breakwater route for its public name. The fleet's
# threat model keeps breakwater bound to the Tailscale IP only; the public edge
# is nginx on the VPS, terminating TLS with its own Certbot certificate.
# That preserves the tailnet-is-the-boundary invariant that `harness` relies on.
#
# Containerised for the same reason as blog/readout: the VPS ships Ruby 3.2.3
# and this app targets 3.4.8, so a native install would mean maintaining a second
# Ruby on the host. What tugboat ships is the image as a tar, and the systemd
# unit loads it on start — so the deploy is still one atomic artifact swap plus
# a unit restart, and a failed health check still rolls back to the previous
# image exactly like a binary would.
#
# Infra provisioning (directory layout, master key, systemd unit) is
# deploy/provision.sh — a one-time/on-change step, not run here.
name = "public_site"
description = "Homepage at deepwa7er.com — DW-001 warm-paper, links to blog + GitHub."
host = "deepwa7er"

# 8100 depot, 8101 readout, 8102 blog, 8103 mirror — next free is 8104.
port = 8104

[build]
# Cross-build for the VPS: this Mac is arm64 and the VPS is x86_64, so the
# platform is pinned rather than inherited. buildx runs the Linux build under
# emulation, which is slow but avoids needing a builder on a 2GB host.
# `docker save` writes the image as a tar for tugboat to rsync. It is left
# uncompressed on purpose: successive builds share most layers, so rsync's delta
# transfer moves far less than a fresh gzip would each time.
cmd = "docker buildx build --platform linux/amd64 -t public_site:deploy --load . && docker save public_site:deploy -o {workdir}/public_site-image.tar"

[[artifacts]]
src = "{workdir}/public_site-image.tar"
dest = "/opt/public_site/public_site-image.tar"
mode = "0644"

# public_site binds loopback, so health is a real HTTP check on it. /up is Rails'
# built-in health endpoint: it returns 200 only if the app boots cleanly, which
# is exactly the failure this needs to catch — a bad image loads fine and then
# dies on boot.
#
# The retries are generous: the unit has to `docker load` the image tar before
# the container even starts.
[health]
url = "http://127.0.0.1:8104/up"
retries = 40
interval_ms = 1000

[verify]
# Checked from this machine after the deploy. Deliberately the PUBLIC URL: it is
# the one that must never be broken, and checking it exercises the whole path —
# public DNS, nginx, the Certbot certificate, and the app — rather than just the
# half of it the tailnet can see.
url = "https://deepwa7er.com/up"

[lighthouse]
# Monitor public_site from the fleet dashboard (status + logs).
enroll = true

# NO [state] BLOCK, and the database is NOT YET BACKED UP. Both facts are
# deliberate, and this comment is here so neither is mistaken for an oversight.
# This app keeps its SQLite at /opt/public_site/storage — the standard layout,
# matching blog/readout — which is outside /var/lib/<service>/ where fleet-backup
# looks. See blog/deploy/fleet-backup.md for the one-command manual snapshot
# until the backup set is extended for external-member Rails apps.
