[package]
name = "sonar"
version = "0.1.0"
edition = "2024"
description = "Replays a captured chatbot request against a list of prompts, through an intercepting proxy."

[[bin]]
name = "sonar"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["derive"] }
# rustls-tls so a custom proxy CA (Burp) can be added to the trust store, and
# the workspace disables reqwest's default TLS backends for the musl builds.
reqwest = { workspace = true, features = ["rustls-tls", "json", "gzip"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
