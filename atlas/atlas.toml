# atlas — runtime config.
#
# This is the dev-box service config. `bind` is the host's Tailscale IP so
# breakwater (on the VPS) can reach it over the tailnet; for local development,
# copy this next to a scratch db, set bind to 127.0.0.1, and run
# `cd web && bun run dev` (which proxies /api here).

# The dev box's Tailscale IP. A bind needs a literal local address, so unlike
# breakwater's upstream (which uses the MagicDNS name) this is the raw IP — and
# it is therefore the one place that must be re-checked if the dev box's tailnet
# address ever changes again. It last changed 2026-08-12, when the dev box
# moved from the Mac (deepwater-1) to the Fedora desktop (fedora).
bind = "100.122.40.4"
port = 7880

# The built frontend. `cd web && bun run build` produces web/dist.
web_dir = "~/code/fleet/atlas/web/dist"

# The SQLite graph database. Defaults to ~/.local/share/atlas/atlas.db when
# unset; set explicitly here so the backup story is one visible line.
db = "~/.local/share/atlas/atlas.db"

# The cargo workspaces atlas indexes. Indexing runs rust-analyzer over the
# whole workspace (roughly a `cargo check`), so each entry must build on this
# machine.

[[project]]
name = "fleet"
path = "~/code/fleet"

[[project]]
name = "lagoon"
path = "~/code/lagoon"

[[project]]
name = "netfps"
path = "~/code/netfps"

[[project]]
name = "meridian"
path = "~/code/meridian"
