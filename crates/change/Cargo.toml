[package]
name = "change"
version = "0.1.0"
edition = "2024"
description = "The durable DW-002/DW-003 change domain: rounds, annotations, jj facts, and structured diffs."
license = "MIT"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
