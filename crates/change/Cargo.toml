[package]
name = "change"
version = "0.1.0"
edition = "2024"
description = "The durable DW-002/DW-003 change domain: rounds, annotations, jj facts, and structured diffs."
license = "MIT"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
fizzy = { path = "../fizzy" }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = "10"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
