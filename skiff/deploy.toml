# tugboat deploy manifest — deepwa7er fleet
#   deploy:  tugboat deploy      (from this directory)
#
# skiff is the phone-optimized web UI for the skiff bridge — coding-agent
# sessions across three harnesses (pi, Meta's Muse Code, opencode). Browse
# sessions, read transcripts, send messages, watch replies stream live, and
# abort a run — all from a phone browser over the tailnet. Fronted by breakwater at
# https://skiff.intern.deepwa7er.net (tailnet-only, no public exposure); the
# legacy hostname https://agent.intern.deepwa7er.net still points at the
# Fedora desktop's tailnet IP (hand-written route below) until that host is
# retired.
#
# Containerised for the same reason as blog/readout: the VPS ships Ruby 3.2.3
# and this app targets Ruby 4.0.6 (mise, .ruby-version), so a native install
# would mean maintaining a second Ruby on the host. What tugboat ships is the
# image as a tar, and the systemd unit loads it on start — so the deploy is
# still one atomic artifact swap plus a unit restart, and a failed health check
# still rolls back to the previous image exactly like a binary would.
#
# The skiff bridge stays on 127.0.0.1:4120. On the VPS that bridge must run
# alongside the container and be reachable from it; the container reaches it
# via host.docker.internal (see deploy/provision.sh). The bridge's password
# is shared via SKIFF_BRIDGE_PASSWORD in ~/.config/skiff/secrets on the host
# and is passed into the container as an env var — the Rails initializer also
# reads that file directly when running outside Docker.
#
# Infra provisioning (directory layout, master key, systemd unit, bridge
# wiring) is deploy/provision.sh — a one-time/on-change step, not run here.
name = "skiff"
description = "Phone-optimized web UI for coding-agent sessions — pi, muse, opencode (SSE, tailnet-only)."
host = "deepwa7er"

# Loopback port the container publishes; breakwater fronts it at
# https://skiff.intern.deepwa7er.net. Route is GENERATED from this
# (`tugboat fleet gen`). Port 8120 matches the desktop's tailnet bind and the
# bridge contract — the Rails client's default URL is unchanged.
port = 8120

[build]
# Cross-build for the VPS: this Mac is arm64 and the VPS is x86_64, so the
# platform is pinned rather than inherited. buildx runs the Linux build under
# emulation, which is slow but avoids needing a builder on a 2GB host.
#
# `docker save` writes the image as a tar for tugboat to rsync. It is left
# uncompressed on purpose: successive builds share most layers, so rsync's delta
# transfer moves far less than a fresh gzip would each time.
cmd = "docker buildx build --platform linux/amd64 -t skiff:deploy --load . && docker save skiff:deploy -o {workdir}/skiff-image.tar"

[[artifacts]]
src = "{workdir}/skiff-image.tar"
dest = "/opt/skiff/skiff-image.tar"
mode = "0644"

# skiff binds loopback, so health is a real HTTP check on it. /up is Rails'
# built-in health endpoint: it returns 200 only if the app boots cleanly, which
# is exactly the failure this needs to catch — a bad image loads fine and then
# dies on boot.
#
# The retries are generous: the unit has to `docker load` a ~350MB tar before
# the container even starts.
[health]
url = "http://127.0.0.1:8120/up"
retries = 40
interval_ms = 1000

[verify]
# Checked from this machine after the deploy, through breakwater.
url = "https://skiff.intern.deepwa7er.net/up"

[lighthouse]
# Monitor skiff from the fleet dashboard (status + logs).
enroll = true
