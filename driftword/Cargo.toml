[package]
name = "driftword"
version = "0.1.0"
edition = "2024"
description = "Generates pronounceable fake words — a web service + CLI for the deepwa7er VPS fleet."

[[bin]]
name = "driftword"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"

[profile.release]
strip = true
lto = true
