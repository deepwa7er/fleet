[package]
name = "driftword"
version = "0.1.0"
edition = "2024"
description = "Generates pronounceable fake words — a web service + CLI for the deepwa7er VPS fleet."

[[bin]]
name = "driftword"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
