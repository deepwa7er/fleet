<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>driftword</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="sheet">
    <div class="docbar">
      <span>DOC. DWD-001</span>
      <span>REV. 0.1.0</span>
      <span class="spacer">CLASSIFICATION · PERSONAL</span>
      <span id="corpus">CORPUS · —</span>
    </div>

    <header class="masthead">
      <div class="brand-id">
        <h1>driftword</h1>
        <div class="ident">Pronounceable fake-word generator · markov + phonotactic engines</div>
      </div>
    </header>

    <section class="grid">
      <!-- Controls -->
      <form id="controls" class="panel">
        <h2>Controls</h2>

        <fieldset class="field">
          <legend>Engine</legend>
          <label class="radio"><input type="radio" name="mode" value="markov" checked> markov <span class="hint">— trained on the corpus; most realish</span></label>
          <label class="radio"><input type="radio" name="mode" value="phono"> phono <span class="hint">— syllable rules; brandable</span></label>
        </fieldset>

        <div class="row3">
          <label class="field">COUNT
            <input type="number" id="count" value="20" min="1" max="500" step="1">
          </label>
          <label class="field">MIN LEN
            <input type="number" id="min" value="4" min="1" max="40" step="1">
          </label>
          <label class="field">MAX LEN
            <input type="number" id="max" value="10" min="1" max="40" step="1">
          </label>
        </div>

        <div class="row2">
          <label class="field" title="markov only">ORDER <span class="tag">markov</span>
            <input type="number" id="order" value="3" min="1" max="6" step="1">
          </label>
          <label class="field" title="phono only">SYLLABLES <span class="tag">phono</span>
            <input type="number" id="syllables" value="2" min="1" max="6" step="1">
          </label>
        </div>

        <label class="field">PREFER LETTERS
          <input type="text" id="prefer" placeholder="e.g. aoeinum" autocomplete="off" spellcheck="false">
        </label>

        <div class="row2">
          <label class="field">STRENGTH
            <input type="number" id="strength" value="4" min="0.1" max="50" step="0.1">
          </label>
          <label class="field">SEED <span class="hint">(blank = random)</span>
            <input type="number" id="seed" placeholder="—" step="1">
          </label>
        </div>

        <label class="check">
          <input type="checkbox" id="only"> ONLY preferred letters (strict)
        </label>

        <div class="actions">
          <button type="submit" class="btn btn--primary">GENERATE</button>
          <button type="button" id="copy" class="btn">COPY ALL</button>
        </div>
      </form>

      <!-- Results -->
      <section class="panel results">
        <h2>Output</h2>
        <div id="meta" class="meta">awaiting generation</div>
        <div id="error" class="error hidden"></div>
        <div class="tablewrap">
          <table id="table">
            <thead>
              <tr><th class="num">#</th><th>WORD</th><th class="num">LEN</th></tr>
            </thead>
            <tbody id="rows">
              <tr class="placeholder"><td colspan="3">No words yet — set controls and GENERATE.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>

    <footer class="waterline">
      <span id="status">ready</span>
      <span class="ver">driftword v0.1.0 · deepwa7er fleet</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
