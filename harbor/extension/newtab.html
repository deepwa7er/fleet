<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>harbor</title>
  <link rel="stylesheet" href="newtab.css">
  <!-- Apply the cached fleet theme before first paint; then sync from tide. -->
  <script src="theme.js"></script>
</head>
<body>
  <main class="harbor">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>harbor</h1>
      </div>
      <div id="focus-bar" class="focus-bar hidden" tabindex="0" role="button" aria-label="top next step">
        <span class="focus-arrow" aria-hidden="true">▸</span>
        <span id="focus-text" class="focus-text"></span>
        <span id="focus-proj" class="focus-proj"></span>
      </div>
      <div id="fleet-stat" class="fleet-stat hidden" title="hand-written source lines across the fleet">
        <span id="fleet-loc" class="fleet-loc">—</span>
        <span class="fleet-label">lines of code</span>
      </div>
      <div id="clock" class="clock">—</div>
    </header>

    <nav class="viewtabs" role="tablist" aria-label="view">
      <button id="tab-main" class="viewtab active" role="tab" aria-selected="true">Main</button>
      <button id="tab-graph" class="viewtab" role="tab" aria-selected="false">Graph</button>
    </nav>

    <div id="main-view" class="main-grid">
      <article class="card">
        <h2>Activity</h2>
        <ul id="activity-feed" class="activity-feed" aria-busy="true">
          <li class="act-empty">loading…</li>
        </ul>
      </article>

      <article class="card capture-card">
        <h2>Capture</h2>
        <div class="capture-form">
          <textarea
            id="capture-input"
            class="capture-input"
            placeholder="new thought…"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="capture-footer">
            <span id="capture-status" class="capture-status"></span>
            <button id="capture-btn" class="capture-btn">capture ⌘↵</button>
          </div>
        </div>
      </article>
    </div><!-- /main-view -->

    <section id="graph-view" class="graph-view hidden" role="tabpanel" aria-label="graph">
      <div class="graph-frame">
        <svg id="graph-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <p id="graph-empty" class="graph-empty hidden">no topology.yaml — graph view has nothing to draw</p>
        <ul class="graph-legend">
          <li><span class="lg-swatch lg-project"></span>project</li>
          <li><span class="lg-swatch lg-machine"></span>machine</li>
          <li><span class="lg-line lg-runs-active"></span>runs on (live)</li>
          <li><span class="lg-line lg-runs-failed"></span>runs on (down)</li>
          <li><span class="lg-line lg-codebase"></span>codebase</li>
          <li><span class="lg-line lg-link"></span>connection</li>
        </ul>
      </div>
    </section>

    <footer class="waterline">
      <span id="status">connecting…</span>
      <span class="ver">harbor v0.3.5</span>
    </footer>
  </main>

  <!-- Note detail overlay — opened via focus bar -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <header class="sheet-head">
        <h3 id="sheet-title">—</h3>
        <a id="sheet-repo" class="chip hidden" target="_blank" rel="noreferrer">repo ↗</a>
        <button id="sheet-close" class="sheet-close" aria-label="close">✕</button>
      </header>
      <div id="sheet-body" class="sheet-body markdown"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
