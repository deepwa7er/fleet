<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harbor</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="harbor">
    <div class="docbar">
      <span>DOC. HBR-001</span>
      <span>REV. 0.1.0</span>
      <span class="spacer">CLASSIFICATION · PERSONAL</span>
    </div>

    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-id">
          <h1>harbor</h1>
          <div class="ident">Mission control · secondbrain fleet</div>
        </div>
      </div>
      <div class="now">
        <div id="clock" class="clock">—</div>
        <div id="greeting" class="greeting">welcome aboard</div>
      </div>
    </header>

    <section id="nextup-section" class="nextup-section hidden">
      <article class="card">
        <h2>Next up</h2>
        <ul id="nextup" class="rows compact nextup-list"></ul>
      </article>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Fleet</h2>
        <ul id="fleet" class="rows" aria-busy="true">
          <li class="loading">loading…</li>
        </ul>
      </article>

      <article class="card">
        <h2>Areas</h2>
        <ul id="areas" class="rows" aria-busy="true">
          <li class="loading">loading…</li>
        </ul>
        <h3 class="subhead">VPS services</h3>
        <ul id="services" class="rows compact">
          <li class="loading">—</li>
        </ul>
      </article>
    </section>

    <footer class="waterline">
      <span id="status">connecting…</span>
      <span class="ver">harbor v0.1.0</span>
    </footer>
  </main>

  <!-- Note detail overlay -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <header class="sheet-head">
        <h3 id="sheet-title">—</h3>
        <a id="sheet-repo" class="chip hidden" target="_blank" rel="noreferrer">repo ↗</a>
        <button id="sheet-close" class="sheet-close" aria-label="close">✕</button>
      </header>
      <div id="sheet-body" class="sheet-body markdown"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
