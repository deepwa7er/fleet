# tugboat deploy manifest — github.com/deepwa7er/tugboat
#   deploy:  tugboat deploy      (from this directory)
#
# Routine deploy (ship a new binary). One-time provisioning — the `harbor`
# service user + read-only deploy key, and installing the systemd unit — is
# server/deploy/setup-vps.sh and server/deploy/harbor.service (see README).
name = "harbor"
host = "deepwa7er"
# Loopback port the service binds; breakwater\'s route is GENERATED from this
# (`tugboat fleet gen`).
port = 8090

[build]
requirements = ["x86_64-linux-musl"]
# 1. Pack + sign the extension (build/harbor.crx + build/updates.xml).
# 2. Static musl cross-compile of harbor-server (in ./server). reqwest+rustls
#    pulls in `ring`, which needs the target C compiler, not just the linker
#    (tugboat resolves the host's musl toolchain and exports it to the build).
cmd = "extension/pack.sh && (rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1 || true) && cd server && cargo build --release --target x86_64-unknown-linux-musl"

[[artifacts]]
src = "{workspace}/target/x86_64-unknown-linux-musl/release/harbor-server"
dest = "/usr/local/bin/harbor-server"

# Self-hosted extension + its update manifest, served by harbor-server at
# /extension. /srv/harbor/dist is created by server/deploy/provision.sh.
[[artifacts]]
src = "build/harbor.crx"
dest = "/srv/harbor/dist/harbor.crx"
mode = "0644"

[[artifacts]]
src = "build/updates.xml"
dest = "/srv/harbor/dist/updates.xml"
mode = "0644"

# Install/download landing page, served at /extension/ (ServeDir serves
# index.html for the directory request).
[[artifacts]]
src = "build/index.html"
dest = "/srv/harbor/dist/index.html"
mode = "0644"

# Unpacked extension zip for the "Load unpacked" manual install.
[[artifacts]]
src = "build/harbor-unpacked.zip"
dest = "/srv/harbor/dist/harbor-unpacked.zip"
mode = "0644"

# harbor binds the tailnet IP (no loopback), so health is the unit's active
# state. (default health = `systemctl is-active harbor`)

[lighthouse]
enroll = true
