# harbor-server configuration (VPS baseline).
#
# secondbrain is hosted on THIS VPS as the canonical hub: your computers push
# edits straight here over the tailnet (push-to-deploy), which updates the
# working tree at `source_dir`. harbor just reads that tree — there is no
# `git_remote` and no GitHub involved.
#
# For local development, copy this to `harbor.local.toml`, point `source_dir` at
# your local secondbrain checkout, and bind to 127.0.0.1.
# Run with:  harbor-server harbor.local.toml

# Tailscale IP, so harbor is reachable only from the tailnet — no public
# exposure, same model as lighthouse.
bind = "100.98.184.58"
port = 8090

# The push-to-deploy working tree (see deploy/setup-vps.sh). harbor reads it and
# re-parses every refresh_secs, so a `git push` shows up within that window.
source_dir = "/srv/harbor/secondbrain"

refresh_secs = 60

# Read-only, tailnet-bound service: "*" is fine. Set a specific extension
# origin (chrome-extension://<id>) to lock it down.
allow_origin = "*"
