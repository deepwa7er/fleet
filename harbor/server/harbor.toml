# harbor-server configuration (example / VPS baseline).
#
# For local development, copy this to `harbor.local.toml`, point `source_dir`
# at your secondbrain checkout, drop `git_remote`, and bind to 127.0.0.1.
# Run with:  harbor-server harbor.local.toml

# On the VPS this is the Tailscale IP, so harbor is reachable only from the
# tailnet — no public exposure, same model as lighthouse.
bind = "100.98.184.58"
port = 8090

# Working copy of the secondbrain that harbor reads and keeps in sync.
source_dir = "/srv/harbor/secondbrain"

# When set, harbor clones this into `source_dir` if missing and hard-resets to
# origin/<branch> on each refresh. The secondbrain repo is PRIVATE, so the VPS
# needs read access — add a read-only deploy key for it (see the server README).
git_remote = "git@github.com:deepwa7er/secondbrain.git"
branch = "main"

# How often to re-sync and re-parse (seconds).
refresh_secs = 300

# Read-only, tailnet-bound service: "*" is fine. Set a specific extension
# origin (chrome-extension://<id>) to lock it down.
allow_origin = "*"
