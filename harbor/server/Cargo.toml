[package]
name = "harbor-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Chrome new-tab backend — fleet activity pulse + lagoon capture for the deepwa7er fleet."

[[bin]]
name = "harbor-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
futures = "0.3"
pulldown-cmark = { workspace = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
