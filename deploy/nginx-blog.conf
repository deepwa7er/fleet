# The PUBLIC front door for the blog: https://blog.deepwa7er.com
#
# INSTALL ORDER MATTERS — the certificate must exist before this file is
# enabled. nginx refuses to load a `listen ... ssl` block whose
# `ssl_certificate` is missing, so enabling this first fails `nginx -t` outright
# (verified the hard way). `blog.deepwa7er.com` already resolves to this box
# through the existing wildcard `*.deepwa7er.com` A record, so HTTP-01 works
# with no DNS change.
#
#   # 1. temporary HTTP-only block so ACME can reach the challenge
#   ssh vps 'cat > /etc/nginx/sites-available/blog.deepwa7er.com <<EOF
#   server {
#       listen 147.182.250.13:80;
#       server_name blog.deepwa7er.com;
#       location / { return 200 "provisioning\n"; }
#   }
#   EOF
#   ln -sf /etc/nginx/sites-available/blog.deepwa7er.com \
#          /etc/nginx/sites-enabled/blog.deepwa7er.com
#   nginx -t && systemctl reload nginx'
#
#   # 2. issue the certificate (certonly, so this file is not rewritten)
#   ssh vps 'certbot certonly --nginx -d blog.deepwa7er.com \
#              --non-interactive --agree-tos -m hello@joemafrici.com'
#
#   # 3. install this file over the temporary one
#   scp deploy/nginx-blog.conf vps:/etc/nginx/sites-available/blog.deepwa7er.com
#   ssh vps 'nginx -t && systemctl reload nginx'
#
# `certonly` rather than `certbot --nginx` on purpose: the latter rewrites the
# vhost in place, which would strip every comment in this file — including the
# one below that explains the line the whole security boundary rests on.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE ONE LINE THAT MATTERS FOR SECURITY IS `proxy_set_header Host`.
#
# This app serves two audiences from one process and separates them by hostname:
# the admin routes are drawn inside a constraint on blog.intern.deepwa7er.net
# and simply do not exist for any other host. That constraint reads the Host
# header, which the client controls — so it is only as strong as the proxy in
# front of it.
#
# Pinning Host to a LITERAL (not `$host`, which is what every other vhost on
# this box uses, and what the notes vhost you may copy from uses) is what makes
# it strong: a request to blog.deepwa7er.com carrying a forged
# `Host: blog.intern.deepwa7er.net` arrives at the app rewritten to the public
# hostname and finds no admin routes.
#
# If you change this line to `$host`, the admin becomes reachable from the
# public internet. Admin::BaseController re-checks the same fact and would still
# refuse, but do not rely on that — it is the backstop, not the boundary.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name blog.deepwa7er.com;

    # No `allow`/`deny` block, unlike the notes vhost on this same box — this
    # site is meant to be read by anyone. That is the whole point of it.

    location / {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;

        # See the block above. A literal, never $host.
        proxy_set_header Host blog.deepwa7er.com;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No Upgrade/Connection headers: this app has no Action Cable and no
        # websockets (the framework was skipped at generation). Forwarding an
        # unconditional `Connection: upgrade` the way the notes vhost does is
        # only harmless there because nothing sends Upgrade either.
    }

    # Security headers are deliberately NOT set here. Rails sends its own on
    # every response — HSTS from `config.force_ssl`, plus nosniff, SAMEORIGIN,
    # Referrer-Policy and X-Permitted-Cross-Domain-Policies from
    # ActionDispatch::Response.default_headers. Adding them here would duplicate
    # them, and duplicated HSTS headers are ignored by some clients.

    listen 147.182.250.13:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/blog.deepwa7er.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.deepwa7er.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP redirects to HTTPS. Pinned to the public IPv4 like every other
# vhost on this host: a bare `listen 80` would land in a different listen group
# from the pinned ones and change which server block is the default.
#
# IPv4 only — there is no AAAA record for this name, or for the zone.
server {
    if ($host = blog.deepwa7er.com) {
        return 301 https://$host$request_uri;
    }

    listen 147.182.250.13:80;
    server_name blog.deepwa7er.com;
    return 404;
}
