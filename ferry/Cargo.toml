[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
description = "Address-bar redirect front door for the deepwa7er fleet — `b mail` → mail."

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
percent-encoding = "2"
# Plain-HTTP client for the note-capture POST to the notes app on loopback. No
# TLS feature: the target is 127.0.0.1, and dropping TLS keeps the static-musl
# build free of a crypto backend.
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }
toml_edit = "0.22"
