# tugboat deploy manifest — github.com/deepwa7er/tugboat
#   deploy:  tugboat deploy      (from this directory)
name = "ferry"
host = "deepwa7er"
# Loopback port the service binds; breakwater\'s route is GENERATED from this
# (`tugboat fleet gen`).
port = 7777

[state]
# The live address-bar config (commands added via the web UI).
files = true

[build]
# Static musl release build for the VPS. The target is installed on demand so a
# fresh dev machine works; tugboat resolves the host's musl C toolchain (see README).
cmd = "rustup target add x86_64-unknown-linux-musl >/dev/null 2>&1 || true; cargo build --release --target x86_64-unknown-linux-musl"

[[artifacts]]
src = "{workspace}/target/x86_64-unknown-linux-musl/release/ferry"
dest = "/usr/local/bin/ferry"

[health]
# ferry listens on loopback; `tailscale serve` maps :8443 → 127.0.0.1:7777.
url = "http://127.0.0.1:7777/commands"

[lighthouse]
enroll = true
