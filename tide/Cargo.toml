[package]
name = "tide"
version = "0.1.0"
edition = "2024"
description = "Fleet-wide settings (the shared dark/light theme) for the deepwa7er VPS fleet."

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tower-http = { workspace = true, features = ["cors"] }
