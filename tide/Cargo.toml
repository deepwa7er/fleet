[package]
name = "tide"
version = "0.1.0"
edition = "2024"
description = "Fleet-wide settings (the shared dark/light theme) for the deepwa7er VPS fleet."

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
strip = true
lto = true
